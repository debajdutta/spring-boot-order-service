spring.application.name=order-service
server.port=8080

# ---------- MySQL ----------
# Values come from environment variables, with local-dev defaults.
# DB_PASSWORD has no default on purpose: set it in your shell / IDE run config.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orders_db}?serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:orders_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

# ---------- JPA / Hibernate ----------
# "update" is fine for a prototype; switch to Flyway + "validate" before anything real.
spring.jpa.hibernate.ddl-auto=update
# Don't keep DB sessions open during view rendering / JSON serialization
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Jackson / HTTP ----------
# Reject unknown JSON fields so typos in requests become 400s instead of being ignored
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=order-service
info.app.description=Order Service prototype - phase 1 (no security)
info.app.version=@project.version@

# ---------- App ----------
app.seed-data=true
# Startup tops the table up to this many orders (existing rows are kept)
app.seed-order-count=100

logging.level.io.github.debajdutta.orderservice=INFO
