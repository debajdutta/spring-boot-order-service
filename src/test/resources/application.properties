# Tests use in-memory H2 in MySQL mode, so no database server is needed to run "mvn test".
spring.datasource.url=jdbc:h2:mem:orders_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,mappings
app.seed-data=false
